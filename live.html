<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Shopping · Cellex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/common.css">
  <script src="js/config/edge-functions.js?v=2"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .live-hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 2.5rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .live-red-dot {
      display: inline-block; width: 10px; height: 10px;
      background: #ef4444; border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .live-card {
      background: #1e293b; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.15s, border-color 0.15s;
      display: block; color: inherit; text-decoration: none;
    }
    .live-card:hover { transform: translateY(-2px); border-color: #00d4ff; }
    .live-thumb {
      width: 100%; aspect-ratio: 16/9; object-fit: cover;
      background: #0f172a; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 2.5rem;
      position: relative;
    }
    .live-thumb .live-badge {
      position: absolute; top: 8px; left: 8px;
      background: #ef4444; color: #fff;
      padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <script>
    // Dark-theme header injection
  <script src="js/load-navbar.js"></script>
  </script>

  <div class="live-hero">
    <div class="max-w-6xl mx-auto">
      <div class="inline-flex items-center gap-2 bg-red-500/20 text-red-300 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
        <span class="live-red-dot"></span> Live Shopping
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold mt-3 text-white">Shop in real-time with sellers</h1>
      <p class="text-gray-400 mt-2 max-w-2xl">Watch live demos, ask questions in chat, and buy the featured product with one click.</p>
      <a href="seller/go-live.html" class="inline-flex items-center gap-2 mt-4 bg-gradient-to-r from-cyan-400 to-cyan-700 text-ink-900 font-bold px-4 py-2 rounded-lg text-sm hover:opacity-90">
        <i class="fas fa-video"></i> Go live as a seller
      </a>
    </div>
  </div>

  <main class="max-w-6xl mx-auto p-4">
    <h2 class="text-xl font-bold text-white mt-4 mb-3">
      <span class="live-red-dot"></span> Live now
    </h2>
    <div id="liveNowGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
      <div class="col-span-full text-center py-8 text-gray-500">
        <i class="fas fa-spinner fa-spin text-2xl"></i>
        <div class="mt-2">Loading live sessions…</div>
      </div>
    </div>

    <h2 class="text-xl font-bold text-white mt-8 mb-3">Recent sessions</h2>
    <div id="recentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script>
    (async () => {
      // Live now
      const liveResp = await window.EdgeFunctions.live.list('live');
      const liveNow = document.getElementById('liveNowGrid');
      if (liveResp.success && liveResp.sessions.length > 0) {
        liveNow.innerHTML = liveResp.sessions.map(s => liveCard(s, true)).join('');
      } else {
        liveNow.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="fas fa-video-slash text-4xl text-gray-600"></i>
            <div class="mt-2">No live sessions right now.</div>
            <div class="text-xs mt-1">Check back later or follow your favorite sellers for notifications.</div>
          </div>`;
      }

      // Recent (ended)
      const recentResp = await window.EdgeFunctions.live.list('ended');
      const recent = document.getElementById('recentGrid');
      if (recentResp.success && recentResp.sessions.length > 0) {
        recent.innerHTML = recentResp.sessions.map(s => liveCard(s, false)).join('');
      } else {
        recent.innerHTML = '<div class="col-span-full text-gray-500 text-sm py-4">No recent sessions.</div>';
      }
    })();

    function liveCard(s, isLive) {
      const sellerName = s.seller?.business_name || 'Seller';
      const sellerImg = s.seller?.profile_image;
      const thumb = s.stream_url && s.stream_platform === 'youtube'
        ? `<div class="live-thumb"><iframe width="100%" height="100%" src="${s.stream_url.replace('watch?v=', 'embed/')}" frameborder="0" allowfullscreen></iframe></div>`
        : `<div class="live-thumb">${s.featured_product_id ? '<i class="fas fa-box"></i>' : '<i class="fas fa-video"></i>'}${isLive ? '<span class="live-badge">LIVE</span>' : ''}</div>`;
      return `
        <a href="live-watch.html?id=${s.id}" class="live-card">
          ${thumb}
          <div class="p-3">
            <div class="font-bold text-white text-sm line-clamp-1">${escapeHtml(s.title)}</div>
            <div class="text-xs text-gray-400 mt-1 flex items-center gap-2">
              ${sellerImg
                ? `<img src="${sellerImg}" class="w-5 h-5 rounded-full">`
                : `<div class="w-5 h-5 rounded-full bg-gradient-to-br from-cyan-400 to-cyan-700 flex items-center justify-center text-[10px] font-bold text-ink-900">${(sellerName||'?').charAt(0)}</div>`}
              <span>${escapeHtml(sellerName)}</span>
              ${isLive ? `<span class="ml-auto text-red-400">👁 ${s.viewer_count || 0}</span>` : ''}
            </div>
            ${s.description ? `<div class="text-xs text-gray-500 mt-1 line-clamp-2">${escapeHtml(s.description)}</div>` : ''}
          </div>
        </a>`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
