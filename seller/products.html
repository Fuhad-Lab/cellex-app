<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products · Cellex Seller</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar">
      <div>
        <h1>Products</h1>
        <div class="subtitle">Manage your catalog</div>
      </div>
      <button class="btn-seller" id="add-product-btn">
        <i class="fas fa-plus"></i> Add product
      </button>
    </div>

    <div class="seller-panel">
      <div class="seller-panel-header">
        <h2>All products</h2>
        <input type="search" id="search-input" placeholder="Search…" 
               style="padding:0.4rem 0.7rem;border:1px solid var(--seller-border);border-radius:8px;font-size:0.85rem;">
      </div>
      <div id="products-table-wrap">
        <div class="seller-loading"><div class="spinner"></div>Loading products…</div>
      </div>
    </div>
  </main>

  <!-- Add / Edit product modal -->
  <div id="product-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3 id="modal-title">Add product</h3>
      <form class="seller-form" id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="price">Price (NGN) *</label>
          <input type="number" id="price" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="Electronics, Fashion, Home…">
        </div>
        <div class="form-group">
          <label for="image_url">Image URL</label>
          <input type="url" id="image_url" placeholder="https://…">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-seller secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-seller">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allProducts = [];

    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('products');
      await loadProducts();

      // Wire up buttons
      document.getElementById('add-product-btn').addEventListener('click', () => openModal());
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('product-modal').addEventListener('click', (e) => {
        if (e.target.id === 'product-modal') closeModal();
      });
      document.getElementById('product-form').addEventListener('submit', handleSubmit);
      document.getElementById('search-input').addEventListener('input', (e) => render(e.target.value));
    })();

    async function loadProducts() {
      const resp = await window.EdgeFunctions.sellerProducts.list();
      if (!resp.success) {
        window.SellerUI.toast('Failed to load products: ' + (resp.error || ''), 'error');
        return;
      }
      allProducts = resp.products || [];
      render('');
    }

    function render(filter) {
      const wrap = document.getElementById('products-table-wrap');
      const f = filter.trim().toLowerCase();
      const list = f
        ? allProducts.filter(p => (p.name || '').toLowerCase().includes(f) || (p.category || '').toLowerCase().includes(f))
        : allProducts;

      if (!list.length) {
        wrap.innerHTML = `<div class="seller-empty">
          <i class="fas fa-box-open"></i>
          <div>No products yet. Click <strong>Add product</strong> to create one.</div>
        </div>`;
        return;
      }

      wrap.innerHTML = `
        <table class="seller-table">
          <thead><tr>
            <th>Product</th><th>Category</th><th>Price</th><th>Sold</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map(p => `
              <tr>
                <td>
                  <div class="product-row">
                    ${p.image_url
                      ? `<img class="product-thumb" src="${window.SellerUI.escapeHtml(p.image_url)}" alt="">`
                      : `<div class="product-thumb placeholder"><i class="fas fa-box"></i></div>`}
                    <div>
                      <div class="name">${window.SellerUI.escapeHtml(p.name)}</div>
                      <div class="meta">${window.SellerUI.escapeHtml((p.description || '').slice(0, 60))}${(p.description||'').length > 60 ? '…' : ''}</div>
                    </div>
                  </div>
                </td>
                <td><span class="badge gray">${window.SellerUI.escapeHtml(p.category || 'General')}</span></td>
                <td>${window.SellerUI.money(p.price)}</td>
                <td>${p.units_sold || 0}</td>
                <td>
                  <button class="btn-seller secondary small" data-edit="${p.id}"><i class="fas fa-pen"></i></button>
                  <button class="btn-seller danger small" data-delete="${p.id}"><i class="fas fa-trash"></i></button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;

      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.addEventListener('click', () => {
          const p = allProducts.find(x => String(x.id) === b.dataset.edit);
          if (p) openModal(p);
        });
      });
      wrap.querySelectorAll('[data-delete]').forEach(b => {
        b.addEventListener('click', async () => {
          if (!confirm('Delete this product?')) return;
          const id = b.dataset.delete;
          const r = await window.EdgeFunctions.sellerProducts.delete(id);
          if (r.success) {
            window.SellerUI.toast('Product deleted');
            await loadProducts();
          } else {
            window.SellerUI.toast('Delete failed: ' + (r.error || ''), 'error');
          }
        });
      });
    }

    function openModal(product = null) {
      document.getElementById('modal-title').textContent = product ? 'Edit product' : 'Add product';
      document.getElementById('product-id').value    = product?.id || '';
      document.getElementById('name').value          = product?.name || '';
      document.getElementById('price').value         = product?.price || '';
      document.getElementById('category').value      = product?.category || '';
      document.getElementById('image_url').value     = product?.image_url || '';
      document.getElementById('description').value   = product?.description || '';
      document.getElementById('product-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('product-modal').style.display = 'none';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const id    = document.getElementById('product-id').value;
      const data  = {
        name:        document.getElementById('name').value.trim(),
        price:       parseFloat(document.getElementById('price').value),
        category:    document.getElementById('category').value.trim() || 'General',
        image_url:   document.getElementById('image_url').value.trim(),
        description: document.getElementById('description').value.trim(),
      };

      const r = id
        ? await window.EdgeFunctions.sellerProducts.update(id, data)
        : await window.EdgeFunctions.sellerProducts.create(data);

      if (r.success) {
        window.SellerUI.toast(id ? 'Product updated' : 'Product added — posted to your feed');
        closeModal();
        await loadProducts();
      } else {
        window.SellerUI.toast('Save failed: ' + (r.error || ''), 'error');
      }
    }
  </script>
</body>
</html>
