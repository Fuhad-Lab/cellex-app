<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders · Cellex Seller</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar">
      <div>
        <h1>Orders</h1>
        <div class="subtitle">Customer orders that include your products</div>
      </div>
    </div>

    <div class="seller-panel">
      <div id="orders-wrap">
        <div class="seller-loading"><div class="spinner"></div>Loading orders…</div>
      </div>
    </div>
  </main>

  <script>
    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('orders');

      const resp = await window.EdgeFunctions.sellerOrders.list();
      const wrap = document.getElementById('orders-wrap');

      if (!resp.success) {
        wrap.innerHTML = `<div class="seller-empty"><i class="fas fa-triangle-exclamation"></i><div>${window.SellerUI.escapeHtml(resp.error || 'Failed to load')}</div></div>`;
        return;
      }

      const orders = resp.orders || [];
      if (!orders.length) {
        wrap.innerHTML = `<div class="seller-empty">
          <i class="fas fa-receipt"></i>
          <div>No orders yet — they will appear here when customers buy your products.</div>
        </div>`;
        return;
      }

      wrap.innerHTML = `
        <table class="seller-table">
          <thead><tr>
            <th>Order #</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th>
          </tr></thead>
          <tbody>
            ${orders.map(o => {
              const items = o.items || [];
              const itemsHtml = items.map(i => `
                <div class="product-row" style="margin:0.25rem 0;">
                  ${i.product_image
                    ? `<img class="product-thumb" src="${window.SellerUI.escapeHtml(i.product_image)}" alt="">`
                    : `<div class="product-thumb placeholder"><i class="fas fa-box"></i></div>`}
                  <div>
                    <div class="name" style="font-size:0.85rem;">${window.SellerUI.escapeHtml(i.product_name)}</div>
                    <div class="meta">×${i.quantity} · ${window.SellerUI.money(i.price)}</div>
                  </div>
                </div>`).join('');
              const status = (o.status || 'pending').toLowerCase();
              const badgeClass = status === 'completed' ? 'green' : status === 'cancelled' ? 'red' : 'amber';
              return `
                <tr>
                  <td><strong>${window.SellerUI.escapeHtml(o.order_number || (o.id || '').slice(0,8))}</strong></td>
                  <td>${itemsHtml}</td>
                  <td>${window.SellerUI.money(o.total)}</td>
                  <td><span class="badge ${badgeClass}">${window.SellerUI.escapeHtml(status)}</span></td>
                  <td>${window.SellerUI.timeAgo(o.created_at)}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    })();
  </script>
</body>
</html>
