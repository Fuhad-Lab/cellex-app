<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login · Cellex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .login-card { background: #1e293b; border-radius: 24px; box-shadow: 0 4px 30px rgba(0,212,255,0.15); padding: 2.5rem; max-width: 420px; width: 100%; border: 1px solid rgba(0,212,255,0.2); }
        .login-btn { background: linear-gradient(135deg, #00d4ff, #0891b2); color: #0f172a; font-weight: 700; transition: all 0.3s; }
        .login-btn:hover { box-shadow: 0 0 30px rgba(0,212,255,0.5); transform: translateY(-1px); }
        .login-input { background: #0f172a; border: 2px solid #334155; color: #e2e8f0; transition: all 0.3s; }
        .login-input:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.15); outline: none; }
        .login-input::placeholder { color: #64748b; }
        .spinner { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .logo-text { background: linear-gradient(135deg, #00d4ff, #0891b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .buyer-link { background: rgba(0,212,255,0.05); border: 1px solid rgba(0,212,255,0.2); transition: all 0.3s; }
        .buyer-link:hover { background: rgba(0,212,255,0.1); border-color: #00d4ff; }
    </style>
</head>
<body>
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="../index.html" class="inline-block">
                <h1 class="text-4xl font-extrabold logo-text" style="font-family: 'Sora', sans-serif;">Cellex</h1>
            </a>
            <p class="text-gray-400 mt-1 text-sm">Seller Center</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h2 class="text-2xl font-bold text-white mb-1">Seller Login</h2>
            <p class="text-gray-400 mb-6 text-sm">Sign in to manage your store</p>

            <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg p-3 mb-4 text-sm"></div>

            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
                    <input type="email" id="email" required
                        class="login-input w-full px-4 py-3 rounded-xl"
                        placeholder="seller@example.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="login-input w-full px-4 py-3 rounded-xl"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="remember" class="rounded border-gray-600 text-cyan-500 focus:ring-cyan-400 bg-gray-800">
                        <span class="ml-2 text-sm text-gray-400">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-cyan-400 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" id="loginButton"
                    class="login-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                    <svg class="spinner hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Sign in to Seller Dashboard
                </button>
            </form>

            <div class="mt-5 text-center">
                <p class="text-sm text-gray-400">
                    New seller?
                    <a href="../signup.html?next=/seller/index.html" class="font-medium text-cyan-400 hover:underline">Create account</a>
                </p>
            </div>

            <!-- Buyer login link -->
            <a href="../login.html" class="buyer-link mt-5 flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-medium text-gray-300 no-underline">
                <i class="fas fa-shopping-bag text-cyan-400"></i>
                Shopping? Login as buyer
            </a>
        </div>
    </div>

    <script src="../js/config/edge-functions.js?v=2"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const loadingIcon = loginButton.querySelector('.spinner');

        function showError(msg) { errorMessage.textContent = msg; errorMessage.classList.remove('hidden'); }
        function hideError() { errorMessage.classList.add('hidden'); }
        function setLoading(isLoading) { loadingIcon.classList.toggle('hidden', !isLoading); loginButton.disabled = isLoading; }

        async function performLogin() {
            hideError();
            setLoading(true);
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const result = await window.EdgeFunctions.auth.login(email, password);
                if (!result.success) {
                    showError(result.error || 'Incorrect email or password.');
                    return;
                }
                // Redirect to seller dashboard
                window.location.href = 'index.html';
            } catch (error) {
                showError(error.message || 'Failed to sign in');
            } finally {
                setLoading(false);
            }
        }

        loginForm.addEventListener('submit', async (e) => { e.preventDefault(); await performLogin(); });

        // If already logged in, go straight to dashboard
        window.addEventListener('load', async () => {
            try {
                const result = await window.EdgeFunctions.auth.checkSession();
                if (result.success && result.user) {
                    window.location.href = 'index.html';
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
