<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · Cellex Seller</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar"><div><h1>Settings</h1><div class="subtitle">Account preferences</div></div></div>

    <div class="seller-panel">
      <div class="seller-panel-header"><h2>Account</h2></div>
      <p style="color:var(--seller-text-muted);">Signed in as <strong id="email" style="color:var(--seller-text);"></strong></p>
      <p style="margin-top:1rem;">
        <a href="../profile.html" class="btn-seller secondary">
          <i class="fas fa-user"></i> Edit buyer profile
        </a>
        <button class="btn-seller danger" id="logout-btn" style="margin-left:0.5rem;">
          <i class="fas fa-sign-out-alt"></i> Sign out
        </button>
      </p>
    </div>

    <div class="seller-panel">
      <div class="seller-panel-header"><h2>Danger zone</h2></div>
      <p style="color:var(--seller-text-muted);">Need to delete your seller account? Contact support — this action cannot be undone.</p>
      <button class="btn-seller danger" disabled style="margin-top:1rem;opacity:0.5;cursor:not-allowed;">
        <i class="fas fa-trash"></i> Delete account
      </button>
    </div>
  </main>

  <script>
    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('settings');
      document.getElementById('email').textContent = user.email || '';
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await window.EdgeFunctions.auth.logout();
        window.location.href = '../index.html';
      });
    })();
  </script>
</body>
</html>
