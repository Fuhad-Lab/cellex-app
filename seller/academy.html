<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy · Cellex Seller</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar"><div><h1>Academy</h1><div class="subtitle">Learn to grow your store</div></div></div>
    <div class="seller-panel">
      <div class="seller-empty">
        <i class="fas fa-graduation-cap"></i>
        <h2 style="margin:0.5rem 0;">Coming soon</h2>
        <p style="max-width:480px;margin:0 auto;">
          The Cellex Seller Academy will offer bite-sized courses on product photography,
          pricing, customer service, and growing your social following.
          Stay tuned — we're building it now.
        </p>
      </div>
    </div>
  </main>
  <script>
    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('academy');
    })();
  </script>
</body>
</html>
