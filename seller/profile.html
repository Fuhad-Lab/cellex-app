<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Profile · Cellex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar">
      <div>
        <h1>Seller profile</h1>
        <div class="subtitle">This is how buyers see your store</div>
      </div>
      <a href="../seller-profile.html" class="btn-seller secondary" id="view-public-btn">
        <i class="fas fa-external-link"></i> View public profile
      </a>
    </div>

    <div class="seller-panel">
      <div class="seller-panel-header"><h2>Store details</h2></div>
      <form class="seller-form" id="profile-form" style="max-width:560px;">
        <div class="form-group">
          <label for="business_name">Business name</label>
          <input type="text" id="business_name" placeholder="e.g. Tjhay Electronics">
        </div>
        <div class="form-group">
          <label for="business_description">About your store</label>
          <textarea id="business_description" rows="3" placeholder="What do you sell? What makes your store special?"></textarea>
        </div>
        <div class="form-group">
          <label for="business_category">Category</label>
          <input type="text" id="business_category" placeholder="Electronics, Fashion, Home & Living…">
        </div>
        <div class="form-group">
          <label for="business_location">Location</label>
          <input type="text" id="business_location" placeholder="Lagos, Nigeria">
        </div>
        <div class="form-group">
          <label for="profile_image">Profile image URL</label>
          <input type="url" id="profile_image" placeholder="https://…">
        </div>
        <div class="form-group">
          <label for="phone">Contact phone</label>
          <input type="tel" id="phone" placeholder="+234 …">
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1.5rem;">
          <button type="submit" class="btn-seller"><i class="fas fa-save"></i> Save changes</button>
        </div>
      </form>
    </div>

    <div class="seller-panel">
      <div class="seller-panel-header"><h2>Social stats</h2></div>
      <div class="stat-grid" style="margin-bottom:0;">
        <div class="stat-card">
          <div class="stat-icon purple"><i class="fas fa-users"></i></div>
          <div class="stat-label">Followers</div>
          <div class="stat-value" id="followers-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pink"><i class="fas fa-stream"></i></div>
          <div class="stat-label">Posts</div>
          <div class="stat-value" id="posts-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas fa-box"></i></div>
          <div class="stat-label">Products</div>
          <div class="stat-value" id="products-count">0</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentSellerId = null;

    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('profile');

      // Load profile
      const resp = await window.EdgeFunctions.sellerProfile.get();
      if (!resp.success || !resp.seller) {
        window.SellerUI.toast('Could not load profile', 'error');
        return;
      }
      const s = resp.seller;
      currentSellerId = s.id;

      // Populate form
      document.getElementById('business_name').value        = s.business_name || '';
      document.getElementById('business_description').value = s.business_description || '';
      document.getElementById('business_category').value    = s.business_category || '';
      document.getElementById('business_location').value    = s.business_location || '';
      document.getElementById('profile_image').value        = s.profile_image || '';
      document.getElementById('phone').value                = s.phone || s.contact_phone || '';

      // Update "View public profile" link
      document.getElementById('view-public-btn').href = '../seller-profile.html?id=' + encodeURIComponent(s.id);

      // Stats
      const statsResp = await window.EdgeFunctions.sellerDashboard.stats();
      if (statsResp.success) {
        document.getElementById('followers-count').textContent = statsResp.totals.followers;
        document.getElementById('posts-count').textContent     = statsResp.totals.posts;
        document.getElementById('products-count').textContent  = statsResp.totals.products;
      }

      // Submit
      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const r = await window.EdgeFunctions.sellerProfile.update({
          business_name:        document.getElementById('business_name').value.trim(),
          business_description: document.getElementById('business_description').value.trim(),
          business_category:    document.getElementById('business_category').value.trim(),
          business_location:    document.getElementById('business_location').value.trim(),
          profile_image:        document.getElementById('profile_image').value.trim(),
          phone:                document.getElementById('phone').value.trim(),
        });
        if (r.success) {
          window.SellerUI.toast('Profile saved');
        } else {
          window.SellerUI.toast('Save failed: ' + (r.error || ''), 'error');
        }
      });
    })();
  </script>
</body>
</html>
