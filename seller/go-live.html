<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Live · Cellex Seller</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="../js/config/edge-functions.js"></script>
  <script src="js/shared.js"></script>
</head>
<body class="seller-page">
  <button class="seller-mobile-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
  <aside class="seller-sidebar"></aside>

  <main class="seller-main">
    <div class="seller-topbar">
      <div>
        <h1>Go Live</h1>
        <div class="subtitle">Start a live shopping session</div>
      </div>
      <a href="../live.html" class="btn-seller secondary">
        <i class="fas fa-video"></i> Watch others
      </a>
    </div>

    <div class="seller-panel">
      <div class="seller-panel-header"><h2>Start a new session</h2></div>
      <form class="seller-form" id="goLiveForm" style="max-width:560px;">
        <div class="form-group">
          <label for="title">Stream title *</label>
          <input type="text" id="title" required placeholder="e.g. 🔥 Flash sale — Electronics deals!">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="What will you showcase? What's the special deal?"></textarea>
        </div>
        <div class="form-group">
          <label for="featuredProductId">Featured product (buyers can buy this during the stream)</label>
          <select id="featuredProductId">
            <option value="">Loading your products…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="streamPlatform">Stream source</label>
          <select id="streamPlatform">
            <option value="none">Text-only (chat-only live)</option>
            <option value="youtube">YouTube live</option>
            <option value="hls">HLS video (.m3u8 URL)</option>
          </select>
        </div>
        <div class="form-group" id="streamUrlGroup" style="display:none;">
          <label for="streamUrl">Stream URL</label>
          <input type="url" id="streamUrl" placeholder="https://youtube.com/watch?v=…  or  https://…/stream.m3u8">
        </div>
        <button type="submit" class="btn-seller" style="margin-top:1rem;">
          <i class="fas fa-broadcast-tower"></i> Go live now
        </button>
      </form>
    </div>

    <div class="seller-panel hidden" id="liveStatusPanel">
      <div class="seller-panel-header">
        <h2>🔴 You are live now</h2>
        <button class="btn-seller danger small" id="endStreamBtn">
          <i class="fas fa-stop"></i> End stream
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
        <div>
          <div class="stat-label">Title</div>
          <div class="stat-value" style="font-size:1.1rem;" id="liveTitle">—</div>
        </div>
        <div>
          <div class="stat-label">Viewers</div>
          <div class="stat-value" style="font-size:1.1rem;" id="liveViewers">0</div>
        </div>
        <div>
          <div class="stat-label">Duration</div>
          <div class="stat-value" style="font-size:1.1rem;" id="liveDuration">0:00</div>
        </div>
        <div style="margin-left:auto;">
          <a id="watchLink" href="#" target="_blank" class="btn-seller secondary">
            <i class="fas fa-external-link"></i> Open watch page
          </a>
        </div>
      </div>
      <div class="mt-3 p-3 bg-cyan-50 border border-cyan-200 rounded-lg text-sm text-amber-900">
        <strong>💡 Tip:</strong> Share this link on WhatsApp so buyers can join:<br>
        <code id="shareLink" style="font-size:0.85rem;"></code>
      </div>
    </div>
  </main>

  <script>
    let liveSessionId = null;
    let liveStartedAt = null;
    let durationTimer = null;
    let viewerTimer = null;

    (async () => {
      const user = await window.SellerUI.requireSeller();
      if (!user) return;
      window.SellerUI.mountSidebar('live');

      // Load seller's products for the featured dropdown
      const prodResp = await window.EdgeFunctions.sellerProducts.list();
      const select = document.getElementById('featuredProductId');
      if (prodResp.success && prodResp.products.length) {
        select.innerHTML = '<option value="">— None —</option>' +
          prodResp.products.map(p => `<option value="${p.id}">${p.name} — $${Number(p.price).toFixed(2)}</option>`).join('');
      } else {
        select.innerHTML = '<option value="">No products yet — add one first</option>';
      }

      // Stream URL visibility
      document.getElementById('streamPlatform').addEventListener('change', (e) => {
        document.getElementById('streamUrlGroup').style.display = e.target.value === 'none' ? 'none' : 'block';
      });

      // Check if seller already has an active session
      const nextResp = await window.EdgeFunctions.live.myNext();
      if (nextResp.success && nextResp.session) {
        showLiveStatus(nextResp.session);
      }

      // Form submit
      document.getElementById('goLiveForm').addEventListener('submit', handleStart);
      document.getElementById('endStreamBtn').addEventListener('click', handleEnd);
    })();

    async function handleStart(e) {
      e.preventDefault();
      const data = {
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        streamPlatform: document.getElementById('streamPlatform').value,
        streamUrl: document.getElementById('streamUrl').value.trim() || null,
      };
      const fp = document.getElementById('featuredProductId').value;
      if (fp) data.featuredProductId = Number(fp);

      if (!data.title) {
        window.SellerUI.toast('Please enter a title', 'error');
        return;
      }

      const r = await window.EdgeFunctions.live.start(data);
      if (r.success) {
        window.SellerUI.toast('🔴 You are live!');
        showLiveStatus(r.session);
      } else {
        window.SellerUI.toast('Failed to go live: ' + (r.error || ''), 'error');
      }
    }

    function showLiveStatus(session) {
      liveSessionId = session.id;
      liveStartedAt = session.started_at ? new Date(session.started_at) : new Date();
      document.getElementById('liveStatusPanel').classList.remove('hidden');
      document.getElementById('liveTitle').textContent = session.title;
      const url = `${window.location.origin}/live-watch.html?id=${session.id}`;
      document.getElementById('watchLink').href = url;
      document.getElementById('shareLink').textContent = url;

      // Duration timer
      if (durationTimer) clearInterval(durationTimer);
      durationTimer = setInterval(() => {
        const secs = Math.floor((Date.now() - liveStartedAt.getTime()) / 1000);
        const mm = Math.floor(secs / 60), ss = secs % 60;
        document.getElementById('liveDuration').textContent = `${mm}:${ss.toString().padStart(2,'0')}`;
      }, 1000);

      // Viewer poll
      if (viewerTimer) clearInterval(viewerTimer);
      viewerTimer = setInterval(async () => {
        const r = await window.EdgeFunctions.live.get(liveSessionId);
        if (r.success) {
          document.getElementById('liveViewers').textContent = r.session.viewer_count || 0;
          if (r.session.status !== 'live') {
            // Stream ended (e.g. from another tab)
            clearInterval(durationTimer);
            clearInterval(viewerTimer);
            document.getElementById('liveStatusPanel').classList.add('hidden');
            window.SellerUI.toast('Stream ended');
          }
        }
      }, 5000);
    }

    async function handleEnd() {
      if (!liveSessionId) return;
      if (!confirm('End the live session?')) return;
      const r = await window.EdgeFunctions.live.end(liveSessionId);
      if (r.success) {
        clearInterval(durationTimer);
        clearInterval(viewerTimer);
        document.getElementById('liveStatusPanel').classList.add('hidden');
        liveSessionId = null;
        window.SellerUI.toast('Stream ended');
      } else {
        window.SellerUI.toast('Failed to end: ' + (r.error || ''), 'error');
      }
    }
  </script>
</body>
</html>
