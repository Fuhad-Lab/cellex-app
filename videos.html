<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellex Videos · Shop what you see</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="js/config/edge-functions.js?v=2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

    .feed-container {
      height: 100vh; height: 100dvh;
      width: 100vw; max-width: 480px;
      margin: 0 auto; position: relative;
      overflow-y: scroll; scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    .video-card {
      height: 100vh; height: 100dvh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      background: #111;
      display: flex; align-items: center; justify-content: center;
    }
    .video-card video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .video-card .placeholder {
      text-align: center; color: #94a3b8;
    }
    .video-card .placeholder i { font-size: 4rem; }

    /* Overlay UI */
    .overlay-bottom {
      position: absolute; bottom: 0; left: 0; right: 80px;
      padding: 1.5rem 1rem 4rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      pointer-events: none;
    }
    .overlay-side {
      position: absolute; right: 0.5rem; bottom: 5rem;
      display: flex; flex-direction: column; gap: 1rem;
      align-items: center;
    }
    .side-btn {
      background: transparent; border: none; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; font-size: 0.75rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .side-btn i { font-size: 1.8rem; margin-bottom: 4px; }
    .side-btn .avatar-mini {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #00d4ff, #0891b2);
      border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #0f172a; font-size: 1.2rem;
      overflow: hidden;
    }
    .side-btn .avatar-mini img { width: 100%; height: 100%; object-fit: cover; }

    .seller-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .seller-row .name { font-weight: 700; font-size: 0.95rem; }
    .seller-row .follow-mini {
      background: #00d4ff; color: #0f172a;
      border: none; padding: 3px 10px; border-radius: 4px;
      font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }
    .caption { font-size: 0.9rem; line-height: 1.4; max-height: 4em; overflow: hidden; }
    .product-card-overlay {
      margin-top: 0.75rem; background: rgba(255,255,255,0.95);
      color: #0f172a; padding: 0.6rem; border-radius: 8px;
      display: flex; gap: 0.6rem; align-items: center;
      pointer-events: auto; text-decoration: none;
      max-width: 320px;
    }
    .product-card-overlay img, .product-card-overlay .ph {
      width: 48px; height: 48px; border-radius: 6px; object-fit: cover;
      background: #f1f5f9; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .product-card-overlay .pname { font-weight: 600; font-size: 0.85rem; line-height: 1.2; }
    .product-card-overlay .pprice { color: #0891b2; font-weight: 700; font-size: 0.95rem; }
    .product-card-overlay .pcta { color: #00d4ff; font-size: 0.75rem; margin-top: 2px; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      padding: 1rem; text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
      pointer-events: none;
    }
    .topbar a {
      color: #fff; text-decoration: none; font-weight: 700;
      pointer-events: auto;
      background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 999px;
      font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;
    }

    .empty-state {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 2rem;
    }
    .empty-state i { font-size: 3rem; color: #475569; margin-bottom: 1rem; }
    .empty-state a {
      margin-top: 1.5rem; background: #00d4ff; color: #0f172a;
      padding: 0.7rem 1.5rem; border-radius: 8px; text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

<!-- Universal Navbar -->
<div id="nav-mount"></div>
<script src="js/load-navbar.js"></script>

  <div class="topbar">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to home</a>
  </div>
  <div class="feed-container" id="feed"></div>

  <script>
    let currentUser = null;
    let videos = [];
    let currentIndex = 0;

    (async () => {
      // Check auth (optional — feed is personalized if logged in)
      const sess = await window.EdgeFunctions.auth.checkSession();
      currentUser = sess.user || null;

      // Load feed
      const r = await window.EdgeFunctions.videos.feed(20);
      if (!r.success || !r.videos || r.videos.length === 0) {
        document.getElementById('feed').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-film"></i>
            <h2>No videos yet</h2>
            <p style="color:#94a3b8;max-width:300px;margin-top:0.5rem;">
              Sellers haven't uploaded any product videos yet. Check back soon!
            </p>
            <a href="index.html">Continue shopping</a>
          </div>`;
        return;
      }
      videos = r.videos;
      renderFeed();

      // Track scroll position to increment view counts
      const feed = document.getElementById('feed');
      let scrollTimer = null;
      feed.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const idx = Math.round(feed.scrollTop / window.innerHeight);
          if (idx !== currentIndex && idx < videos.length) {
            currentIndex = idx;
            window.EdgeFunctions.videos.get(videos[idx].id).catch(() => {});
          }
        }, 200);
      });

      // Log view for the first video
      window.EdgeFunctions.videos.get(videos[0].id).catch(() => {});
    })();

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = videos.map((v, i) => `
        <div class="video-card" data-idx="${i}">
          ${v.video_url
            ? `<video src="${escapeAttr(v.video_url)}" loop muted ${i === 0 ? 'autoplay' : ''} playsinline onclick="this.paused ? this.play() : this.pause()"></video>`
            : `<div class="placeholder"><i class="fas fa-film"></i><div style="margin-top:0.5rem;">Video unavailable</div></div>`}

          <div class="overlay-bottom">
            <div class="seller-row">
              <span class="name">${escapeHtml(v.seller?.business_name || 'Seller')}</span>
              ${currentUser && v.seller && currentUser.id !== v.seller.id
                ? `<button class="follow-mini" onclick="quickFollow('${v.seller.id}', this)">Follow</button>`
                : ''}
            </div>
            <div class="caption">${escapeHtml(v.caption || '')}</div>
            ${v.product ? `
              <a href="product.html?id=${v.product.id}" class="product-card-overlay">
                ${v.product.image_url
                  ? `<img src="${escapeAttr(v.product.image_url)}" alt="">`
                  : `<div class="ph"><i class="fas fa-box"></i></div>`}
                <div>
                  <div class="pname">${escapeHtml(v.product.name)}</div>
                  <div class="pprice">$${Number(v.product.price).toFixed(2)}</div>
                  <div class="pcta">View product →</div>
                </div>
              </a>` : ''}
          </div>

          <div class="overlay-side">
            <button class="side-btn" onclick="toggleLike(${v.id}, this)" data-liked="${v.liked}">
              <i class="fas fa-heart" style="color: ${v.liked ? '#ef4444' : '#fff'};"></i>
              <span class="like-count">${v.likes_count || 0}</span>
            </button>
            <button class="side-btn" onclick="shareVideo('${v.id}', '${escapeAttr(v.product?.name || '')}')">
              <i class="fas fa-share"></i>
              <span>Share</span>
            </button>
            <a class="side-btn" href="seller-profile.html?id=${v.seller?.id || ''}" style="text-decoration:none;color:#fff;">
              ${v.seller?.profile_image
                ? `<div class="avatar-mini"><img src="${escapeAttr(v.seller.profile_image)}" alt=""></div>`
                : `<div class="avatar-mini">${(v.seller?.business_name || '?').charAt(0).toUpperCase()}</div>`}
              <span style="font-size:0.65rem;">${escapeHtml((v.seller?.business_name || '').slice(0, 10))}</span>
            </a>
          </div>
        </div>`).join('');

      // Auto-play videos as they scroll into view
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          const video = e.target.querySelector('video');
          if (e.isIntersecting && video) {
            video.play().catch(() => {});
          } else if (video) {
            video.pause();
          }
        });
      }, { threshold: 0.6 });
      document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
    }

    async function toggleLike(videoId, btn) {
      if (!currentUser) {
        if (confirm('Login to like videos?')) {
          window.location.href = 'login.html?next=' + encodeURIComponent('/videos.html');
        }
        return;
      }
      const liked = btn.dataset.liked === 'true';
      const r = liked
        ? await window.EdgeFunctions.videos.unlike(videoId)
        : await window.EdgeFunctions.videos.like(videoId);
      if (r.success) {
        btn.dataset.liked = liked ? 'false' : 'true';
        const icon = btn.querySelector('i');
        const count = btn.querySelector('.like-count');
        icon.style.color = liked ? '#fff' : '#ef4444';
        count.textContent = Math.max(0, parseInt(count.textContent) + (liked ? -1 : 1));
      }
    }

    async function quickFollow(sellerId, btn) {
      if (!currentUser) return;
      const r = await window.EdgeFunctions.social.follow(sellerId);
      if (r.success) {
        btn.textContent = 'Following';
        btn.disabled = true;
        btn.style.opacity = '0.6';
      }
    }

    function shareVideo(videoId, productName) {
      const url = `${window.location.origin}/videos.html`;
      const text = `🛍️ Watch this product video on Cellex — "${productName}" ${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/`/g, '&#96;');
    }
  </script>
</body>
</html>
