<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller · Cellex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="js/config/edge-functions.js?v=2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #fff; color: #0f172a; }
    
    /* Profile header — Depop style */
    .sp-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, #00d4ff, #0891b2); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: #fff; flex-shrink: 0; }
    .sp-name { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
    .sp-meta { font-size: 0.8rem; color: #64748b; }
    .sp-stats { display: flex; align-items: center; gap: 1rem; }
    .sp-stat-num { font-weight: 700; font-size: 0.95rem; color: #0f172a; }
    .sp-stat-label { font-size: 0.75rem; color: #64748b; }
    .follow-btn { background: linear-gradient(135deg, #00d4ff, #0891b2); color: #0f172a; font-weight: 700; padding: 0.5rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .follow-btn:hover { box-shadow: 0 0 20px rgba(0,212,255,0.4); }
    .follow-btn.following { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
    .msg-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .msg-btn:hover { border-color: #00d4ff; color: #00d4ff; }
    
    /* Tabs */
    .sp-tabs { display: flex; border-bottom: 1px solid #e2e8f0; margin-bottom: 1rem; }
    .sp-tab { padding: 0.75rem 1.25rem; font-weight: 600; font-size: 0.9rem; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .sp-tab:hover { color: #0f172a; }
    .sp-tab.active { color: #0f172a; border-bottom-color: #00d4ff; }
    
    /* Product grid — 2 columns on mobile, 3 on tablet, 4 on desktop */
    .sp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    @media (min-width: 640px) { .sp-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .sp-grid { grid-template-columns: repeat(4, 1fr); } }
    .sp-product { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #f1f5f9; transition: transform 0.2s; text-decoration: none; color: inherit; }
    .sp-product:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,212,255,0.1); }
    .sp-product img, .sp-product .ph { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f8fafc; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 2rem; }
    .sp-product .info { padding: 0.5rem; }
    .sp-product .pname { font-size: 0.8rem; font-weight: 500; line-height: 1.3; height: 2.4em; overflow: hidden; color: #334155; }
    .sp-product .pprice { font-size: 0.9rem; font-weight: 700; color: #00d4ff; margin-top: 0.2rem; }
    
    /* Reviews section */
    .sp-review { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid #f1f5f9; }
    .sp-review:last-child { border-bottom: none; }
    .sp-review-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #0891b2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
    
    .sp-loading { text-align: center; padding: 3rem; color: #94a3b8; }
  </style>
</head>
<body>
  <!-- Universal Navbar -->
  <div id="nav-mount"></div>
  <script src="js/load-navbar.js"></script>

  <!-- Seller Profile -->
  <main class="max-w-4xl mx-auto px-4 py-6 pb-20 md:pb-6">
    <!-- Profile Header (Depop style) -->
    <div id="sp-header" class="mb-4">
      <div class="flex items-start gap-4 mb-4">
        <!-- Avatar -->
        <div id="sp-avatar" class="sp-avatar">?</div>
        
        <!-- Name + stats -->
        <div class="flex-1 min-w-0">
          <div id="sp-name" class="sp-name">Loading…</div>
          <div id="sp-meta" class="sp-meta mt-0.5"></div>
          
          <!-- Stats row -->
          <div class="sp-stats mt-3">
            <div>
              <div id="sp-followers" class="sp-stat-num">0</div>
              <div class="sp-stat-label">Followers</div>
            </div>
            <div>
              <div id="sp-products" class="sp-stat-num">0</div>
              <div class="sp-stat-label">Products</div>
            </div>
            <div>
              <div id="sp-rating" class="sp-stat-num">—</div>
              <div class="sp-stat-label">Rating</div>
            </div>
          </div>
        </div>
        
        <!-- Follow + Message buttons -->
        <div class="flex items-center gap-2">
          <button id="follow-btn" class="follow-btn" disabled>Follow</button>
          <button class="msg-btn" onclick="alert('Messaging coming soon!')">
            <i class="far fa-envelope text-sm"></i>
          </button>
        </div>
      </div>
      
      <!-- Bio -->
      <p id="sp-bio" class="text-sm text-gray-600 mb-2"></p>
    </div>

    <!-- Tabs -->
    <div class="sp-tabs">
      <div class="sp-tab active" data-tab="all" onclick="switchTab('all')">All</div>
      <div class="sp-tab" data-tab="videos" onclick="switchTab('videos')">Videos</div>
      <div class="sp-tab" data-tab="products" onclick="switchTab('products')">Products</div>
    </div>

    <!-- All tab: shows both products and videos mixed -->
    <div id="tab-all">
      <div id="sp-grid" class="sp-grid">
        <div class="sp-loading">Loading…</div>
      </div>
    </div>

    <!-- Videos tab -->
    <div id="tab-videos" style="display:none;">
      <div id="sp-videos" class="sp-loading">Loading videos…</div>
    </div>

    <!-- Products tab -->
    <div id="tab-products" style="display:none;">
      <div id="sp-products" class="sp-grid">
        <div class="sp-loading">Loading products…</div>
      </div>
    </div>
  </main>

  <script>
    let sellerId = null;
    let viewerId = null;
    let isFollowing = false;
    let allProducts = [];

    (async () => {
      const params = new URLSearchParams(location.search);
      sellerId = params.get('id');
      if (!sellerId) {
        document.querySelector('main').innerHTML = '<div class="text-center py-12 text-gray-500">No seller selected. <a href="index.html" class="text-cyan-600">Browse sellers</a></div>';
        return;
      }

      // Get current user
      const sess = await window.EdgeFunctions.auth.checkSession();
      if (sess.success && sess.user) viewerId = sess.user.id;

      // Load seller profile + all products + videos in parallel
      const [profileResp, productsResp, videosResp] = await Promise.all([
        window.EdgeFunctions.social.publicProfile(sellerId, viewerId),
        window.EdgeFunctions.products.all(100),
        window.EdgeFunctions.videos.bySeller(sellerId),
      ]);

      if (!profileResp.success || !profileResp.seller) {
        document.querySelector('main').innerHTML = '<div class="text-center py-12 text-gray-500">Seller not found.</div>';
        return;
      }

      const s = profileResp.seller;
      const stats = profileResp.stats;
      isFollowing = profileResp.isFollowing;
      allProducts = productsResp.success ? (productsResp.products || []) : [];

      // Filter this seller's products
      const sellerProducts = allProducts.filter(p => p.seller_id === sellerId);

      // Set page title
      document.title = (s.business_name || s.farm_name || 'Seller') + ' · Cellex';

      // Avatar
      const avatarEl = document.getElementById('sp-avatar');
      if (s.profile_image) {
        avatarEl.innerHTML = `<img src="${s.profile_image}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarEl.textContent = (s.business_name || s.farm_name || '?').charAt(0).toUpperCase();
      }

      // Name + meta
      document.getElementById('sp-name').textContent = s.business_name || s.farm_name || 'Unnamed store';
      const metaParts = [];
      if (s.business_category) metaParts.push(s.business_category);
      if (s.business_location) metaParts.push(s.business_location);
      if (s.seller_type) metaParts.push(s.seller_type.toLowerCase());
      document.getElementById('sp-meta').textContent = metaParts.join(' · ');

      // Stats
      document.getElementById('sp-followers').textContent = stats.followers;
      document.getElementById('sp-products').textContent = sellerProducts.length;
      
      // Rating
      if (reviewsResp.success && reviewsResp.summary && reviewsResp.summary.count > 0) {
        document.getElementById('sp-rating').textContent = reviewsResp.summary.avg.toFixed(1) + '★';
      } else {
        document.getElementById('sp-rating').textContent = '—';
      }

      // Bio
      document.getElementById('sp-bio').textContent = s.business_description || '';

      // Follow button
      const followBtn = document.getElementById('follow-btn');
      followBtn.disabled = false;

      if (!viewerId) {
        followBtn.textContent = 'Login to follow';
        followBtn.onclick = () => { window.location.href = 'login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search); };
      } else if (viewerId === sellerId) {
        followBtn.textContent = 'Your store';
        followBtn.disabled = true;
        followBtn.style.opacity = '0.5';
      } else {
        renderFollowButton();
        followBtn.onclick = toggleFollow;
      }

      // Get seller's videos
      const sellerVideos = (videosResp.success ? (videosResp.videos || []) : []).filter(v => v.seller_id === sellerId);

      // Build product card HTML
      function productCard(p) {
        return `<a href="product.html?id=${p.id}" class="sp-product">
            ${p.image_url
              ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">`
              : `<div class="ph"><i class="fas fa-box"></i></div>`}
            <div class="info">
              <div class="pname">${escapeHtml(p.name)}</div>
              <div class="pprice">₦${Number(p.price).toLocaleString('en-NG', {minimumFractionDigits: 0})}</div>
            </div>
          </a>`;
      }

      // Build video card HTML
      function videoCard(v) {
        return `<a href="videos.html" class="sp-product" style="position:relative;">
            ${v.video_url
              ? `<video src="${v.video_url}" muted preload="metadata" style="width:100%;aspect-ratio:1;object-fit:cover;background:#000;"></video>`
              : `<div class="ph"><i class="fas fa-video"></i></div>`}
            <div style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;">▶ Video</div>
            <div class="info">
              <div class="pname">${escapeHtml(v.caption || v.product?.name || 'Product video')}</div>
              <div class="pprice" style="color:#64748b;font-size:0.7rem;">${v.views_count || 0} views</div>
            </div>
          </a>`;
      }

      // All tab: mix of products and videos
      const allGrid = document.getElementById('sp-grid');
      const allItems = [
        ...sellerProducts.map(p => ({type: 'product', html: productCard(p), sort: p.created_at})),
        ...sellerVideos.map(v => ({type: 'video', html: videoCard(v), sort: v.created_at})),
      ].sort((a, b) => new Date(b.sort) - new Date(a.sort));

      if (allItems.length === 0) {
        allGrid.innerHTML = '<div class="sp-loading">No items yet.</div>';
      } else {
        allGrid.innerHTML = allItems.map(i => i.html).join('');
      }

      // Videos tab
      const videosEl = document.getElementById('sp-videos');
      if (sellerVideos.length === 0) {
        videosEl.classList.remove('sp-loading');
        videosEl.innerHTML = '<div class="sp-loading">No videos yet.</div>';
      } else {
        videosEl.classList.remove('sp-loading');
        videosEl.innerHTML = `<div class="sp-grid">${sellerVideos.map(v => videoCard(v)).join('')}</div>`;
      }

      // Products tab
      const productsEl = document.getElementById('sp-products');
      if (sellerProducts.length === 0) {
        productsEl.innerHTML = '<div class="sp-loading">No products yet.</div>';
      } else {
        productsEl.innerHTML = sellerProducts.map(p => productCard(p)).join('');
      }
    })();

    function renderFollowButton() {
      const btn = document.getElementById('follow-btn');
      btn.textContent = isFollowing ? 'Following' : 'Follow';
      btn.classList.toggle('following', isFollowing);
    }

    async function toggleFollow() {
      const btn = document.getElementById('follow-btn');
      btn.disabled = true;
      const r = isFollowing
        ? await window.EdgeFunctions.social.unfollow(sellerId)
        : await window.EdgeFunctions.social.follow(sellerId);
      if (r.success) {
        isFollowing = !isFollowing;
        const followersEl = document.getElementById('sp-followers');
        followersEl.textContent = Math.max(0, parseInt(followersEl.textContent) + (isFollowing ? 1 : -1));
        renderFollowButton();
      }
      btn.disabled = false;
    }

    function switchTab(tab) {
      document.querySelectorAll('.sp-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.sp-tab[data-tab="${tab}"]`).classList.add('active');
      ['all', 'videos', 'products'].forEach(name => {
        document.getElementById('tab-' + name).style.display = name === tab ? 'block' : 'none';
      });
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
