<!DOCTYPE html>
<html>
<head>
<title>Cellex WhatsApp QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; color: white; padding: 20px; }
.container { text-align: center; max-width: 500px; }
h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 1.5rem; }
#qr-img { max-width: 350px; width: 100%; border-radius: 20px; padding: 20px; background: white; display: none; }
#loading { color: #00d4ff; font-size: 1.2rem; padding: 40px; }
#error { color: #ef4444; font-size: 1rem; padding: 20px; display: none; }
.instructions { color: #aaa; font-size: 0.85rem; margin-top: 1.5rem; line-height: 1.6; }
.warning { color: #00d4ff; font-size: 0.85rem; margin-top: 0.5rem; }
.btn { background: #00d4ff; color: #0f172a; border: none; padding: 12px 32px; border-radius: 30px; font-size: 1rem; cursor: pointer; margin-top: 1.5rem; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
<h1>📱 WhatsApp QR Code</h1>
<p class="subtitle">Scan to connect your WhatsApp number to Cellex</p>
<div id="loading">⏳ Generating QR code...</div>
<div id="error"></div>
<img id="qr-img" alt="WhatsApp QR Code" />
<div class="instructions">
    <strong>How to connect:</strong><br>
    1. Open WhatsApp on your phone<br>
    2. Tap Settings → Linked Devices<br>
    3. Tap "Link a Device"<br>
    4. Scan the QR code above
</div>
<p class="warning">⏰ QR expires in 60 seconds. Click refresh if it expires.</p>
<button class="btn" onclick="loadQR()">🔄 Refresh QR Code</button>
</div>
<script>
// Use the web-server proxy to avoid CORS issues
// The proxy at /api/openwa/* injects the X-API-Key header server-side
const PROXY_URL = '/api/openwa';
const SESSION_NAME = 'eeshamart-main';

async function loadQR() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('qr-img').style.display = 'none';

    try {
        // Step 1: List sessions to find existing one
        let resp = await fetch(`${PROXY_URL}/api/sessions`);
        let sessions = await resp.json();
        let session = Array.isArray(sessions) ? sessions[0] : null;

        // Step 2: If no session, create one
        if (!session) {
            console.log('Creating new session...');
            resp = await fetch(`${PROXY_URL}/api/sessions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: SESSION_NAME })
            });
            session = await resp.json();
        }

        const sessionId = session.id;
        console.log('Session ID:', sessionId);

        // Step 3: Start the session
        await fetch(`${PROXY_URL}/api/sessions/${sessionId}/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });

        // Step 4: Wait a moment for QR to generate
        await new Promise(r => setTimeout(r, 3000));

        // Step 5: Get QR code
        resp = await fetch(`${PROXY_URL}/api/sessions/${sessionId}/qr`);
        const data = await resp.json();

        const qrCode = data.qrCode || data.qr || data.base64;
        if (qrCode && qrCode.length > 100) {
            document.getElementById('qr-img').src = qrCode;
            document.getElementById('qr-img').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        } else {
            throw new Error('QR code not ready yet. Click refresh.');
        }
    } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = `❌ ${err.message}<br><br>Try refreshing. If it keeps failing, <a href="https://eesha-search.onrender.com" target="_blank" style="color:#00d4ff">click here to wake the gateway</a>, then refresh.`;
    }
}
loadQR();
</script>
</body>
</html>
