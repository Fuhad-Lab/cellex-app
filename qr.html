<!DOCTYPE html>
<html>
<head>
<title>Cellex WhatsApp QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; color: white; padding: 20px; }
.container { text-align: center; max-width: 500px; }
h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 1.5rem; }
#qr-img { max-width: 350px; width: 100%; border-radius: 20px; padding: 20px; background: white; display: none; }
#loading { color: #fb5b1b; font-size: 1.2rem; padding: 40px; }
#error { color: #ef4444; font-size: 1rem; padding: 20px; display: none; }
.instructions { color: #aaa; font-size: 0.85rem; margin-top: 1.5rem; line-height: 1.6; }
.warning { color: #fb5b1b; font-size: 0.85rem; margin-top: 0.5rem; }
.btn { background: #fb5b1b; color: white; border: none; padding: 12px 32px; border-radius: 30px; font-size: 1rem; cursor: pointer; margin-top: 1.5rem; text-decoration: none; display: inline-block; }
.btn:hover { background: #ec4509; }
</style>
</head>
<body>
<div class="container">
<h1>📱 WhatsApp QR Code</h1>
<p class="subtitle">Scan to connect your WhatsApp number to Cellex</p>

<div id="loading">⏳ Generating QR code...</div>
<div id="error"></div>
<img id="qr-img" alt="WhatsApp QR Code" />

<div class="instructions">
    <strong>How to connect:</strong><br>
    1. Open WhatsApp on your phone<br>
    2. Tap Settings → Linked Devices<br>
    3. Tap "Link a Device"<br>
    4. Scan the QR code above
</div>
<p class="warning">⏰ QR expires in 60 seconds. Click refresh if it expires.</p>
<button class="btn" onclick="loadQR()">🔄 Refresh QR Code</button>
</div>

<script>
const GATEWAY_URL = 'https://eesha-search.onrender.com';
const API_KEY = 'EeshaMartSuperSecretToken123';
const INSTANCE_NAME = 'eeshamart_main';

async function loadQR() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('qr-img').style.display = 'none';

    try {
        // First, try to connect directly
        let resp = await fetch(`${GATEWAY_URL}/instance/connect/${INSTANCE_NAME}`, {
            headers: { 'apikey': API_KEY }
        });
        let data = await resp.json();

        // If instance doesn't exist, create it first
        if (resp.status === 404 || (data.status === 404)) {
            console.log('Instance not found, creating...');
            await fetch(`${GATEWAY_URL}/instance/create`, {
                method: 'POST',
                headers: { 'apikey': API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    instanceName: INSTANCE_NAME,
                    token: 'EeshaInstanceSecureToken789',
                    qrcode: true
                })
            });

            // Now try to connect again
            resp = await fetch(`${GATEWAY_URL}/instance/connect/${INSTANCE_NAME}`, {
                headers: { 'apikey': API_KEY }
            });
            data = await resp.json();
        }

        if (data.base64 && data.base64.length > 100) {
            document.getElementById('qr-img').src = data.base64;
            document.getElementById('qr-img').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        } else if (data.code) {
            // Show pairing code as alternative
            document.getElementById('loading').innerHTML = 
                `📋 Pairing Code: <strong style="font-size:1.5rem;color:#fb5b1b;letter-spacing:3px">${data.pairingCode || data.code}</strong><br><br>Or scan the QR code below:`;
            if (data.base64) {
                document.getElementById('qr-img').src = data.base64;
                document.getElementById('qr-img').style.display = 'block';
            }
        } else {
            throw new Error('No QR code in response');
        }
    } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = 
            `❌ Error: ${err.message}<br><br>Try refreshing. If it keeps failing, the gateway might be sleeping.<br><a href="${GATEWAY_URL}/" target="_blank" style="color:#fb5b1b">Click here to wake up the gateway</a>, then refresh.`;
    }
}

// Auto-load on page open
loadQR();
</script>
</body>
</html>
