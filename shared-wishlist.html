<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Wishlist · Cellex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/common.css">
  <script src="js/config/edge-functions.js?v=2"></script>
  <style>
    body { background: #f8fafc; }
    .sw-hero {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      padding: 2.5rem 1.5rem;
      border-bottom: 1px solid #fcd34d;
    }
    .sw-product-card {
      background: #fff; border-radius: 12px;
      border: 1px solid #e2e8f0; overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      display: block; color: inherit; text-decoration: none;
    }
    .sw-product-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
    .sw-product-card img, .sw-product-card .ph {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      background: #f1f5f9; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 2rem;
    }
  </style>
</head>
<body>
  <div id="header-mount"></div>
  <script>fetch('shared/header.html').then(r=>r.text()).then(h=>document.getElementById('header-mount').innerHTML=h);</script>

  <div class="sw-hero">
    <div class="max-w-5xl mx-auto">
      <div class="inline-flex items-center gap-2 bg-amber-500 text-ink-900 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
        <i class="fas fa-gift"></i> Shared Wishlist
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold mt-3" id="sw-title">Loading…</h1>
      <div class="text-sm text-gray-700 mt-1" id="sw-meta"></div>
    </div>
  </div>

  <main class="max-w-5xl mx-auto p-4">
    <div id="sw-content" class="py-8 text-center text-gray-500">
      <i class="fas fa-spinner fa-spin text-2xl"></i>
      <div class="mt-2">Loading wishlist…</div>
    </div>
  </main>

  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      if (!token) {
        document.getElementById('sw-content').innerHTML = '<div class="py-8 text-red-500">No share token provided.</div>';
        return;
      }
      const r = await window.EdgeFunctions.wishlistShare.getShared(token);
      if (!r.success) {
        document.getElementById('sw-content').innerHTML = `<div class="py-8 text-red-500">${escapeHtml(r.error || 'Share link not found.')}</div>`;
        return;
      }
      document.getElementById('sw-title').textContent = r.wishlist.title;
      document.getElementById('sw-meta').textContent =
        `Shared on ${new Date(r.wishlist.created_at).toLocaleDateString()} · ${r.wishlist.view_count} view${r.wishlist.view_count !== 1 ? 's' : ''}`;

      const items = r.items || [];
      if (items.length === 0) {
        document.getElementById('sw-content').innerHTML = '<div class="py-12 text-center text-gray-500"><i class="fas fa-heart text-3xl"></i><div class="mt-2">This wishlist is empty.</div></div>';
        return;
      }

      document.getElementById('sw-content').className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 py-6';
      document.getElementById('sw-content').innerHTML = items.map(it => {
        const p = it.product;
        if (!p) return '';
        return `
          <a href="product.html?id=${p.id}" class="sw-product-card">
            ${p.image_url
              ? `<img src="${p.image_url}" alt="">`
              : `<div class="ph"><i class="fas fa-box"></i></div>`}
            <div class="p-3">
              <div class="font-medium text-sm line-clamp-2 h-10 overflow-hidden">${escapeHtml(p.name)}</div>
              <div class="text-amber-600 font-bold mt-1">$${Number(p.price).toFixed(2)}</div>
              <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(p.category || '')}</div>
            </div>
          </a>`;
      }).join('');
    })();

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
