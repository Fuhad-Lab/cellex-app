<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cellex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block">
                <h1 class="text-4xl font-extrabold text-[#f0474a]">Cellex</h1>
            </a>
            <h2 class="mt-4 text-3xl font-bold text-gray-900">Create your account</h2>
            <p class="mt-2 text-gray-600">Get started with Cellex</p>
        </div>

        <!-- Signup Card -->
        <div class="bg-white shadow-xl rounded-lg p-8">
            <!-- Email/Password Form -->
            <form id="signupForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                    <input type="email" id="email" name="email" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#f0474a] focus:border-[#f0474a]">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required minlength="6"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#f0474a] focus:border-[#f0474a]">
                </div>

                <button type="submit" id="signupButton"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-white bg-[#f0474a] hover:bg-[#e43d40] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#f0474a]">
                    <span>Sign up</span>
                    <i class="fas fa-spinner loading ml-2 hidden"></i>
                </button>

                <!-- Message Area -->
                <div id="messageArea" class="hidden text-sm text-center"></div>
            </form>

            <!-- Sign In Link -->
            <p class="mt-6 text-center text-sm text-gray-600">
                Already have an account?
                <a href="login.html" class="font-medium text-[#f0474a] hover:underline">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Scripts: Edge function client only (NO Supabase SDK) -->
    <script src="../js/config/edge-functions.js?v=2"></script>
    <script>
        // Elements
        const signupForm = document.getElementById('signupForm');
        const signupButton = document.getElementById('signupButton');
        const messageArea = document.getElementById('messageArea');
        const loadingIcon = signupButton.querySelector('.loading');

        // Helper Functions
        function showMessage(message, isError = true) {
            messageArea.textContent = message;
            messageArea.classList.remove('hidden', 'text-red-600', 'text-green-600');
            messageArea.classList.add(isError ? 'text-red-600' : 'text-green-600');
        }

        function hideMessage() {
            messageArea.classList.add('hidden');
        }

        function setLoading(isLoading) {
            loadingIcon.classList.toggle('hidden', !isLoading);
            signupButton.disabled = isLoading;
        }

        // Email/Password Sign Up via edge function
        async function performSignUp() {
            hideMessage();
            setLoading(true);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const result = await window.EdgeFunctions.auth.signup(email, password);

                if (!result.success) {
                    showMessage(result.error || 'Failed to sign up');
                    return;
                }

                // Check if user got a session (some Supabase configs require email verification)
                if (result.session) {
                    // User is logged in immediately
                    showMessage('Sign-up successful! Redirecting...', false);
                    setTimeout(() => { window.location.href = '../index.html'; }, 1500);
                } else {
                    // Email verification required
                    showMessage('Sign-up successful! Please check your email for a verification link.', false);
                    signupForm.reset();
                }
            } catch (err) {
                showMessage(err.message || 'Failed to sign up');
            } finally {
                setLoading(false);
            }
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await performSignUp();
        });

        signupButton.type = 'button';
        signupButton.addEventListener('click', async (e) => {
            e.preventDefault();
            await performSignUp();
        });
    </script>
</body>
</html>
