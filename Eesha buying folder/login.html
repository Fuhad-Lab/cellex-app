<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cellex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block">
                <h1 class="text-4xl font-extrabold text-[#f0474a]">Cellex</h1>
            </a>
            <p class="text-gray-500 mt-2">Nigeria's #1 Marketplace</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome back</h2>
            <p class="text-gray-500 mb-6">Please sign in to continue</p>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg p-3 mb-4 text-sm"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f0474a] focus:border-transparent"
                        placeholder="you@example.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f0474a] focus:border-transparent"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember" class="rounded border-gray-300 text-[#f0474a] focus:ring-[#f0474a]">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-[#f0474a] hover:underline">Forgot password?</a>
                </div>

                <button type="submit" id="loginButton"
                    class="w-full bg-[#f0474a] text-white py-3 rounded-lg font-semibold hover:bg-[#d93e41] transition-colors flex items-center justify-center gap-2">
                    <svg class="loading hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Sign in
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Don't have an account?
                    <a href="signup.html" class="font-medium text-[#f0474a] hover:underline">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts: Edge function client only (NO Supabase SDK) -->
    <script src="../js/config/edge-functions.js?v=2"></script>
    <script>
        // Elements
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const loadingIcon = loginButton.querySelector('.loading');

        // Helper Functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        function setLoading(isLoading) {
            loadingIcon.classList.toggle('hidden', !isLoading);
            loginButton.disabled = isLoading;
        }

        // Email/Password Login via edge function (no Supabase SDK)
        async function performLogin() {
            hideError();
            setLoading(true);

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const result = await window.EdgeFunctions.auth.login(email, password);

                if (!result.success) {
                    showError(result.error || 'Incorrect email or password. New user? Please sign up.');
                    return;
                }

                // Login successful — redirect to home
                window.location.href = '../index.html';
            } catch (error) {
                showError(error.message || 'Failed to sign in');
            } finally {
                setLoading(false);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await performLogin();
        });

        // Check session on load (via edge function — if already logged in, redirect)
        window.addEventListener('load', async () => {
            try {
                const result = await window.EdgeFunctions.auth.checkSession();
                if (result.success && result.user) {
                    // Already logged in — redirect to home
                    window.location.href = '../index.html';
                }
            } catch (e) {
                // Not logged in — stay on login page
            }
        });
    </script>
</body>
</html>
